[project]
name = "statescope"
version = "0.0.1"
description = "Time series state analysis: a state-centric pipeline (vision paper reference implementation)"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "numpy>=1.26,<2.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]
demo = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src layout: the importable package `statescope` lives under src_algo/.
[tool.hatch.build.targets.wheel]
packages = ["src_algo/statescope"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

